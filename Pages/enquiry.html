<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry — Forever Living by Sindi Jubati</title>
    <link rel="stylesheet" href="../Assets/css/style.css">
</head>

<body>
    <!-- Site header: logo + main navigation, shared across all pages -->
    <header>
        <div class="logo">
            <img src="../Assets/images/forever-living-logo_8268.png" alt="Forever Living Logo">
            Forever Living by Sindi Jubati
        </div>

        <!-- Hidden checkbox drives the mobile menu toggle (no JS needed) -->
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation menu">
            <span></span>
        </label>

        <nav>
            <a href="../index.html">Home</a>
            <a href="./about.html">About us</a>
            <a href="./contact.html">Contact Us</a>
            <a href="./enquiry.html">Enquiry</a>
            <a href="./products.html">Products</a>
        </nav>
    </header>

    <!-- Hero: page title banner, same pattern used on every page -->
    <div class="hero">
        <h1>Project Inquiry Form</h1>
        <p class="subtitle">Tell us what you're looking for</p>
    </div>

    <!-- Main section: form -->
    <main>
        <section>
            <!-- Enquiry form, styled via .enquiry-form in style.css -->
            <!-- action="#" is a placeholder — this doesn't actually send
                 anywhere yet; it needs a real endpoint (e.g. a form
                 service, or a backend script) to deliver submissions -->
            <form class="enquiry-form" action="#" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Please enter your name" required>

                <label for="Phone number ">Phone number:</label>
                <input type="tel" id="phone number" name="phone number" required> 

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

             

                <button type="submit">Submit</button>
