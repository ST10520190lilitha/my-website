            <table width="100%" cellpadding="14" cellspacing="0" border="0">

                    </td>
                    <td align="right">
                        <!--Navigation Links-->
                        <nav>

                            </font>
                        </nav>
                    </td>
                </tr>
            </table>
        </td>

    <!-- Hero -->
    <tr>
        <td bgcolor="#EFE7D6" align="center">
            <table cellpadding="20" cellspacing="0" border="0">
                <tr>
                    <td align="center">
                        <font color="#2F4B3C" size="7" face="Georgia, 'Times New Roman', serif"><b>Project Inquiry Form</b></font>
                        <br>
                        <font color="#C08A3E" size="2" face="Arial, Helvetica, sans-serif">TELL US WHAT YOU'RE LOOKING FOR</font>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- Main section: form -->
    <tr>
        <td align="center">
            <table width="90%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td align="center">

                        <br><br>

                        <table bgcolor="#EFE7D6" cellpadding="20" cellspacing="0" border="1" bordercolor="#DDD2B8" width="500">
                            <tr>
                                <td>

                                    <form action="#" method="POST">

                                        <font color="#2F4B3C" face="Arial, Helvetica, sans-serif">
                                            <label for="name">Your Name:</label>
                                        </font><br>
                                        <input type="text" id="name" name="name" placeholder="Tell us who you are" required size="40"><br><br>

                                        <font color="#2F4B3C" face="Arial, Helvetica, sans-serif">
                                            <label for="email">Email Address:</label>
                                        </font><br>
                                        <input type="email" id="email" name="email" placeholder="Where we can reply to you" required size="40"><br><br>

                                        <font color="#2F4B3C" face="Arial, Helvetica, sans-serif">
                                            <label for="project_type">Type of product:</label>
                                        </font><br>
                                        <select id="project_type" name="type_of_product" required>
                                            <option value="">--Select--</option>
                                            <option value="skincare">Skincare</option>
                                            <option value="nutritional_drinks">Nutritional Drinks</option>
                                            <option value="fitness_and_weight_loss">Fitness and Weight Loss</option>
                                            <option value="Immune_Support">Immune Support</option>
                                        </select><br><br>

                                        <font color="#2F4B3C" face="Arial, Helvetica, sans-serif">
                                            <label for="message">Your Enquiry:</label>
                                        </font><br>
                                        <textarea id="message" name="message" rows="5" cols="40" placeholder="Tell us a little more about what you need" required></textarea><br><br>

                                        <input type="submit" value="Send Enquiry">

                                    </form>

                                </td>
                            </tr>
                        </table>

                        <br><br>

                    </td>
                </tr>
            </table>
        </td>
    </tr>
