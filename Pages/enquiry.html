<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry — Forever Living by Sindi Jubati</title>
    <link rel="stylesheet" href="../Assets/css/style.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="../Assets/images/forever-living-logo_8268.png" alt="Forever Living Logo">
            Forever Living by Sindi Jubati
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="./about.html">About us</a>
            <a href="./contact.html">Contact Us</a>
            <a href="./enquiry.html">Enquiry</a>
            <a href="./products.html">Products</a>
        </nav>
    </header>

    <!-- Hero -->
    <div class="hero">
        <h1>Project Inquiry Form</h1>
        <p class="subtitle">Tell us what you're looking for</p>
    </div>

    <!-- Main section: form -->
    <main>
        <section>
            <form class="enquiry-form" action="#" method="POST">

                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" placeholder="Tell us who you are" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Where we can reply to you" required>

                <label for="project_type">Type of product:</label>
                <select id="project_type" name="type_of_product" required>
                    <option value="">--Select--</option>
                    <option value="skincare">Skincare</option>
                    <option value="nutritional_drinks">Nutritional Drinks</option>
                    <option value="fitness_and_weight_loss">Fitness and Weight Loss</option>
                    <option value="Immune_Support">Immune Support</option>
                </select>

                <label for="message">Your Enquiry:</label>
                <textarea id="message" name="message" rows="5" placeholder="Tell us a little more about what you need" required></textarea>

                <input type="submit" value="Send Enquiry">

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Forever Living by Sindi Jubati. All rights reserved. | <a href="./contact.html">Contact Us</a></p>
    </footer>

</body>
</html>
